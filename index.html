<!DOCTYPE html>
<html lang="en">

<head>
  <title>Vinh Le — AI Engineer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="images/linkedinpfp.jpg" />
  <meta name="description"
    content="Vinh Le — AI engineer. Best Hack for Good, 1st VectorAI, co-lead on production software. M.S. CS at Georgia Tech. Projects, experience, and contact." />
  <meta property="og:title" content="Vinh Le — AI Engineer" />
  <meta property="og:description" content="AI Engineer · M.S. CS @ Georgia Tech · Work that has to survive contact with reality." />
  <meta property="og:image" content="images/linkedinpfp.jpg" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Fraunces:ital,opsz,wght@0,144,500;1,144,400;1,144,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    :root {
      --void: #100e0c;
      --ink: #f3ece3;
      --muted: #b7aea3;
      --faint: #7a7268;
      --rule: rgba(243, 236, 227, 0.12);
      --ember: #ff5a2a;
      --panel: rgba(16, 14, 12, 0.88);
    }
    body {
      background: var(--void);
      color: var(--ink);
      font-family: Literata, Georgia, serif;
      font-size: 16.5px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      color-scheme: dark;
    }
    a { color: inherit; }
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(90vw 50vh at 85% -10%, rgba(255, 90, 42, 0.16), transparent 55%),
        radial-gradient(60vw 40vh at -10% 70%, rgba(255, 160, 70, 0.06), transparent 50%);
    }
    .atmosphere::after {
      content: '';
      position: absolute; inset: 0;
      opacity: 0.09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .skip-link { position: absolute; left: -999px; }
    .skip-link:focus {
      position: fixed; left: 1rem; top: 1rem; z-index: 100;
      background: var(--ember); color: #fff; padding: 0.5rem 0.9rem;
    }

    .topnav {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
      padding: 0.9rem 1.6rem;
      background: color-mix(in srgb, var(--void) 72%, transparent);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--rule);
    }
    .topnav .brand {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 1.45rem; font-weight: 800;
      text-decoration: none; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .topnav ul {
      list-style: none; display: flex; flex-wrap: wrap; gap: 0.15rem 1.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
    }
    .topnav a { text-decoration: none; color: var(--muted); }
    .topnav a:hover { color: var(--ink); }
    .topnav .resume { color: var(--ember); }

    .wrap {
      position: relative; z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2.4rem;
      align-items: stretch;
      min-height: calc(100svh - 4.2rem);
      padding: 1.8rem 0 3.2rem;
    }
    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-photo {
      margin: 0;
      position: relative;
      min-height: 28rem;
    }
    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      display: block;
      filter: saturate(0.88) contrast(1.08);
      box-shadow: 0 0 0 1px var(--rule);
    }
    .hero-photo::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: var(--ember);
    }
    .hero h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: clamp(4.2rem, 14vw, 9.2rem);
      line-height: 0.78;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .hero h1 em {
      display: block;
      font-family: Fraunces, serif;
      font-style: italic; font-weight: 400;
      font-size: 0.38em;
      text-transform: none;
      letter-spacing: -0.03em;
      color: var(--ember);
      line-height: 1;
      margin-bottom: 0.08em;
    }
    .hero-row {
      display: grid;
      grid-template-columns: 14rem 1fr;
      gap: 1.5rem;
      margin-top: 1.6rem;
      align-items: start;
      max-width: 820px;
    }
    .hero .role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ember);
      line-height: 1.5;
    }
    .hero .dek {
      font-size: 1.12rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .hero .links {
      margin-top: 1.6rem;
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.35rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
    }
    .hero .links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 90, 42, 0.45);
    }
    .hero .links a:hover { color: var(--ember); }

    section { padding-top: 3.8rem; }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--ember);
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 2rem;
    }

    #featured {
      margin-left: calc(50% - 50vw);
      width: 100vw;
    }
    .feature { margin-bottom: 4.2rem; }
    .feature-media img, .card-media img {
      width: 100%; display: block;
      object-fit: cover;
      background: #1c1916;
    }
    .feature-media img {
      height: min(78vh, 860px);
      filter: saturate(1.08) contrast(1.06);
    }
    .feature-media .ph, .card-media .ph {
      aspect-ratio: 16 / 10;
      background: #1c1916;
    }
    .feature-copy {
      position: relative; z-index: 2;
      max-width: 36rem;
      margin: -7.5rem 0 0 8vw;
      padding: 1.5rem 1.55rem 1.65rem;
      background: var(--panel);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-left: 3px solid var(--ember);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }
    .feature:nth-child(even) .feature-copy {
      margin-left: auto;
      margin-right: 8vw;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem; letter-spacing: 0.1em;
      color: var(--ember);
      margin-bottom: 0.4rem;
    }
    .feature h3, .card h3 {
      font-family: Fraunces, serif;
      font-style: italic; font-weight: 500;
      font-size: clamp(1.85rem, 3.4vw, 2.7rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .card h3 { font-size: 1.55rem; font-style: italic; }
    .award {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-style: normal;
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ember);
      border: 1px solid rgba(255, 90, 42, 0.45);
      padding: 0.1rem 0.42rem;
      margin-left: 0.5rem;
      vertical-align: 0.28em;
      white-space: nowrap;
    }
    .event { margin-top: 0.35rem; font-size: 0.86rem; color: var(--faint); }
    .desc { margin-top: 0.7rem; color: var(--muted); }
    .feature ul {
      margin: 0.7rem 0 0 1.1rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .feature li { margin-bottom: 0.28rem; }
    .tech {
      margin-top: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--faint);
    }
    .out {
      margin-top: 0.9rem;
      display: flex; flex-wrap: wrap; gap: 0.8rem 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
    }
    .out a { color: var(--ember); text-decoration: none; }
    .out a:hover { text-decoration: underline; }

    .work-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.6rem 1.2rem;
    }
    .card { cursor: default; }
    .card-media { overflow: hidden; }
    .card-media img, .card-media .ph { aspect-ratio: 16 / 10; transition: transform 0.7s ease; }
    .card:hover .card-media img { transform: scale(1.05); }
    .card h3 { margin-top: 0.85rem; }

    .earlier { margin-top: 2.8rem; }
    .earlier-item {
      display: grid;
      grid-template-columns: 8.5rem 1fr auto;
      gap: 0.6rem 1rem;
      align-items: baseline;
      padding: 0.85rem 0;
      border-top: 1px solid var(--rule);
      font-size: 0.95rem;
    }
    .earlier-item:last-child { border-bottom: 1px solid var(--rule); }
    .earlier-item b { font-weight: 500; font-family: Fraunces, serif; font-style: italic; }
    .earlier-item span { color: var(--muted); }
    .earlier-item a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; color: var(--ember); text-decoration: none;
      white-space: nowrap;
    }
    .earlier-item a:hover { text-decoration: underline; }

    .about p { margin-top: 1rem; color: var(--muted); max-width: 66ch; }
    .about p:first-of-type { margin-top: 0; color: var(--ink); font-size: 1.15rem; }
    .about .kicker { margin-top: 1.5rem; font-size: 0.82rem; color: var(--faint); letter-spacing: 0.06em; }
    .about .mission {
      margin-top: 0.3rem;
      color: var(--ember);
      font-family: Fraunces, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.45rem;
      line-height: 1.3;
    }

    .xp { margin-bottom: 2.1rem; }
    .row {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .row h3 { font-size: 1.05rem; font-weight: 500; }
    .dates {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; color: var(--faint); white-space: nowrap;
    }
    .org { color: var(--ember); font-size: 0.92rem; margin-top: 0.12rem; }
    .xp ul { margin-top: 0.6rem; padding-left: 1.15rem; }
    .xp li { margin-bottom: 0.35rem; color: var(--muted); font-size: 0.95rem; }

    .split { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 3rem; }
    .skill-row {
      display: grid;
      grid-template-columns: 9.5rem 1fr;
      gap: 0.35rem 1.1rem;
      margin-bottom: 0.6rem;
      font-size: 0.92rem;
    }
    .skill-row dt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--faint); padding-top: 0.25rem;
    }
    .skill-row dd { color: var(--muted); }
    .edu { margin-bottom: 1.3rem; }
    .edu .school { font-weight: 500; }
    .edu .deg { color: var(--muted); font-size: 0.92rem; }
    .edu .note {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; color: var(--ember); margin-top: 0.1rem;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--faint);
    }
    footer a { color: var(--ember); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 1rem;
        gap: 1.4rem;
      }
      .hero-photo {
        order: -1;
        min-height: 0;
        max-height: 58vh;
      }
      .hero-photo img { height: 58vh; }
      .hero-row { grid-template-columns: 1fr; gap: 0.8rem; }
      .feature-copy, .feature:nth-child(even) .feature-copy {
        margin: -3.2rem 1rem 0;
        max-width: none;
      }
      .feature-media img { height: 52vh; }
      .work-grid, .split { grid-template-columns: 1fr; }
      .earlier-item { grid-template-columns: 1fr; gap: 0.2rem; }
    }
    @media (max-width: 540px) {
      .skill-row { grid-template-columns: 1fr; gap: 0.1rem; margin-bottom: 0.9rem; }
      .topnav { padding: 0.75rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card-media img { transition: none; }
      .card:hover .card-media img { transform: none; }
    }
  </style>
</head>

<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <a class="skip-link" href="#work">Skip to work</a>

  <nav class="topnav" aria-label="Primary">
    <a class="brand" href="#top">Vinh Le</a>
    <ul>
      <li><a href="#work">Work</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a class="resume" id="navResume" href="#">Résumé</a></li>
    </ul>
  </nav>

  <div class="wrap" id="top">
    <header class="hero">
      <div class="hero-copy">
        <h1><em>Vinh</em> Le</h1>
        <div class="hero-row">
          <p class="role" id="heroRole"></p>
          <p class="dek" id="heroDek"></p>
        </div>
        <nav class="links" id="heroLinks" aria-label="Contact links"></nav>
      </div>
      <figure class="hero-photo">
        <img src="images/linkedinpfp.jpg" alt="Vinh Le" width="800" height="1200">
      </figure>
    </header>

    <section id="work" aria-labelledby="s-work">
      <h2 class="label" id="s-work">Selected work</h2>
      <div id="featured"></div>
      <div class="work-grid" id="grid"></div>
      <div class="earlier" id="earlierWrap" hidden>
        <h3 class="label" style="margin-top:2.4rem">Earlier</h3>
        <div id="earlier"></div>
      </div>
    </section>

    <section id="about" class="about" aria-labelledby="s-about">
      <h2 class="label" id="s-about">About</h2>
      <div id="aboutBody"></div>
    </section>

    <section id="experience" aria-labelledby="s-xp">
      <h2 class="label" id="s-xp">Experience</h2>
      <div id="xp"></div>
    </section>

    <div class="split">
      <section id="skills" aria-labelledby="s-skills">
        <h2 class="label" id="s-skills">Skills</h2>
        <dl id="skillBody"></dl>
      </section>
      <section id="edu" aria-labelledby="s-edu">
        <h2 class="label" id="s-edu">Education</h2>
        <div id="eduBody"></div>
      </section>
    </div>

    <footer>
      <span>&copy; 2026 Vinh Le</span>
      <span>
        <a id="footResume" href="#">Résumé PDF</a>
        · <a href="classic.html">Plain résumé</a>
      </span>
    </footer>
  </div>

  <noscript>
    <p style="padding:2rem;text-align:center;">
      JavaScript is off.
      <a href="classic.html">Open the plain résumé.</a>
    </p>
  </noscript>

  <script src="shared/data.js"></script>
  <script>
    (function () {
      var V = window.VINH;
      if (!V) return;

      function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function $(id) { return document.getElementById(id); }

      var linkLabels = { demo: 'live demo', github: 'github', devpost: 'devpost', dorahacks: 'dorahacks', app: 'app' };
      function outs(links) {
        var box = el('div', 'out');
        Object.keys(links || {}).forEach(function (k) {
          var a = el('a', null, esc(linkLabels[k] || k) + ' \u2197');
          a.href = links[k];
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          box.appendChild(a);
        });
        return box;
      }
      function media(src, name, cls, eager) {
        var wrap = el('div', cls);
        if (src) {
          wrap.innerHTML = '<img src="' + esc(src) + '" alt="' + esc(name) + '"' +
            (eager ? '' : ' loading="lazy"') + '>';
        } else {
          wrap.appendChild(el('div', 'ph'));
        }
        return wrap;
      }
      function findBuild(id) {
        var list = (V.projects || []).concat(V.earlier || []);
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      $('heroRole').textContent = V.role + ' · ' + V.location;
      $('heroDek').textContent = (V.about && V.about[0]) || V.tagline || '';

      var L = V.links || {};
      if (L.resume) {
        $('navResume').href = L.resume;
        $('footResume').href = L.resume;
        $('navResume').target = '_blank';
        $('navResume').rel = 'noopener noreferrer';
        $('footResume').target = '_blank';
        $('footResume').rel = 'noopener noreferrer';
      }
      [
        ['Email', 'mailto:' + V.email],
        ['GitHub', L.github],
        ['LinkedIn', L.linkedin],
        ['Devpost', L.devpost],
        ['Résumé PDF', L.resume]
      ].forEach(function (pair) {
        var a = el('a', null, esc(pair[0]));
        a.href = pair[1];
        if (String(pair[1]).indexOf('http') === 0) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        $('heroLinks').appendChild(a);
      });

      var A = V.archive || {};
      var top10 = A.top10 || [];
      var featuredIds = A.legendary || top10.slice(0, 2);
      var featuredSet = {};
      featuredIds.forEach(function (id) { featuredSet[id] = true; });
      var topSet = {};
      top10.forEach(function (id) { topSet[id] = true; });

      featuredIds.forEach(function (id, i) {
        var p = findBuild(id);
        if (!p) return;
        var art = el('article', 'feature');
        art.appendChild(media(p.image, p.name, 'feature-media', i === 0));
        var copy = el('div', 'feature-copy');
        var eye = [];
        if (p.award) eye.push(esc(p.award));
        if (p.event) eye.push(esc(p.event));
        if (p.date) eye.push(esc(p.date));
        copy.appendChild(el('p', 'eyebrow', eye.join(' · ')));
        var h = el('h3', null, esc(p.name) + (p.award ? '<span class="award">' + esc(p.award) + '</span>' : ''));
        copy.appendChild(h);
        if (p.desc) copy.appendChild(el('p', 'desc', esc(p.desc)));
        if (p.bullets && p.bullets.length) {
          var ul = el('ul');
          p.bullets.forEach(function (b) { ul.appendChild(el('li', null, esc(b))); });
          copy.appendChild(ul);
        }
        if (p.tech) copy.appendChild(el('p', 'tech', esc(p.tech.join(' · '))));
        copy.appendChild(outs(p.links));
        art.appendChild(copy);
        $('featured').appendChild(art);
      });

      top10.forEach(function (id) {
        if (featuredSet[id]) return;
        var p = findBuild(id);
        if (!p) return;
        var art = el('article', 'card');
        art.appendChild(media(p.image, p.name, 'card-media'));
        var h = el('h3', null, esc(p.name) + (p.award ? '<span class="award">' + esc(p.award) + '</span>' : ''));
        art.appendChild(h);
        var meta = [];
        if (p.event) meta.push(p.event);
        if (p.date) meta.push(p.date);
        if (meta.length) art.appendChild(el('p', 'event', esc(meta.join(' · '))));
        if (p.desc) art.appendChild(el('p', 'desc', esc(p.desc)));
        if (p.tech) art.appendChild(el('p', 'tech', esc(p.tech.join(' · '))));
        art.appendChild(outs(p.links));
        $('grid').appendChild(art);
      });

      var earlierHost = $('earlier');
      var shown = false;
      (V.earlier || []).forEach(function (p) {
        if (topSet[p.id]) return;
        shown = true;
        var row = el('div', 'earlier-item');
        row.appendChild(el('b', null, esc(p.name)));
        row.appendChild(el('span', null, esc(p.desc)));
        var k = Object.keys(p.links || {})[0];
        if (k) {
          var a = el('a', null, esc(linkLabels[k] || k) + ' \u2197');
          a.href = p.links[k];
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          row.appendChild(a);
        }
        earlierHost.appendChild(row);
      });
      if (shown) $('earlierWrap').hidden = false;

      (V.about || []).forEach(function (para) {
        var p = el('p');
        p.textContent = para;
        if (/^At the core/i.test(para)) p.className = 'kicker';
        else if (/^turning /i.test(para)) p.className = 'mission';
        $('aboutBody').appendChild(p);
      });

      (V.experience || []).forEach(function (job) {
        var d = el('div', 'xp');
        d.appendChild(el('div', 'row',
          '<h3>' + esc(job.title) + '</h3><span class="dates">' + esc(job.dates) + '</span>'));
        d.appendChild(el('p', 'org', esc(job.org)));
        var ul = el('ul');
        (job.bullets || []).forEach(function (b) { ul.appendChild(el('li', null, esc(b))); });
        d.appendChild(ul);
        if (job.tech) d.appendChild(el('p', 'tech', esc(job.tech.join(' · '))));
        $('xp').appendChild(d);
      });

      Object.keys(V.skills || {}).forEach(function (cat) {
        var row = el('div', 'skill-row');
        row.appendChild(el('dt', null, esc(cat)));
        row.appendChild(el('dd', null, esc(V.skills[cat].join(', '))));
        $('skillBody').appendChild(row);
      });

      (V.education || []).forEach(function (e) {
        var d = el('div', 'edu');
        d.appendChild(el('div', 'row',
          '<span class="school">' + esc(e.school) + '</span><span class="dates">' + esc(e.dates) + '</span>'));
        d.appendChild(el('p', 'deg', esc(e.degree)));
        if (e.note) d.appendChild(el('p', 'note', esc(e.note)));
        $('eduBody').appendChild(d);
      });
    })();
  </script>
</body>

</html>
